name: Check for Updates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      rev:
        description: 'Fork commit, branch, or tag to update to (default: main)'
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  ORCA_REPO: sjennings/orca

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check fork revision
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REV: ${{ github.event.inputs.rev || 'main' }}
        run: |
          set -euo pipefail

          if [[ -z "$REQUESTED_REV" || ! "$REQUESTED_REV" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid revision: $REQUESTED_REV" >&2
            exit 1
          fi

          current_revision=$(sed -n 's/.*sourceRev = "\([^"]*\)".*/\1/p' package.nix | head -1)
          selected_revision=$(gh api "repos/$ORCA_REPO/commits/$REQUESTED_REV" --jq '.sha')
          if [[ ! "$selected_revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Fork ref did not resolve to a full commit: $REQUESTED_REV" >&2
            exit 1
          fi
          selected_revision=${selected_revision,,}

          echo "Current revision: $current_revision"
          echo "Selected revision: $selected_revision"
          echo "current_revision=$current_revision" >> "$GITHUB_OUTPUT"
          echo "revision=$selected_revision" >> "$GITHUB_OUTPUT"
          if [[ "$current_revision" == "$selected_revision" ]]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update source revision
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_REVISION: ${{ steps.check.outputs.revision }}
        run: |
          set -euo pipefail
          ./scripts/update.sh --rev "$UPDATE_REVISION"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update orca to revision ${{ steps.check.outputs.revision }}"
          title: "chore: update orca to revision ${{ steps.check.outputs.revision }}"
          body: |
            ## Update Orca

            This PR updates the pinned `sjennings/orca` source revision.

            - Previous revision: `${{ steps.check.outputs.current_revision }}`
            - New revision: `${{ steps.check.outputs.revision }}`
            - The package version is read from the selected source `package.json`.
            - Source and pnpm dependency hashes are refreshed and the package is build- and CLI-checked.
            - `flake.lock` is intentionally unchanged.

            ---
            This PR was automatically generated by the update workflow.
          branch: update-orca-${{ steps.check.outputs.revision }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Summary
        if: always()
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          CURRENT_REVISION: ${{ steps.check.outputs.current_revision }}
          SELECTED_REVISION: ${{ steps.check.outputs.revision }}
        run: |
          set -euo pipefail
          echo "## Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$UPDATE_NEEDED" == "true" ]]; then
            echo "- Current revision: $CURRENT_REVISION" >> "$GITHUB_STEP_SUMMARY"
            echo "- Selected revision: $SELECTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pull request created. Auto-merge was attempted when supported." >> "$GITHUB_STEP_SUMMARY"
          else
            CURRENT_REVISION=$(sed -n 's/.*sourceRev = "\([^"]*\)".*/\1/p' package.nix | head -1)
            echo "- Current revision: $CURRENT_REVISION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
